name: Lint

on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install "ruff==0.15.14"

      - name: Run Ruff
        run: |
          ruff check src tests